name: Build Android APK (PlanoraSmartSchedule)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Consistent Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compile & Assemble Android Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanoraSmartSchedule-v1.0.0-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Log Build Information
        run: |
          echo "============================================"
          echo "✅ Android APK successfully compiled!"
          echo "App Name: Planora - Smart Schedule"
          echo "Package ID: app.vercel.planorasmartschlkt0ks74"
          echo "Target Version: 1.0.0 (1)"
          echo "============================================"
